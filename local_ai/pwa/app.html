<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Friday">
  <title>Friday</title>
  <link rel="icon" href="/pwa/friday-icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/pwa/friday-apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/pwa/manifest.webmanifest">
  <link rel="stylesheet" href="/pwa/style.css?v=21">
  <script type="module" src="/pwa/app.js"></script>
</head>
<body class="app-page">
  <div id="app" class="app-shell" aria-busy="true">
    <header class="app-header">
      <h1 class="brand"><img src="/pwa/friday-icon-192.png" width="24" height="24" alt=""><span>Friday</span></h1>
      <div class="header-actions">
        <span id="connection-state" class="status-dot">正在连接</span>
        <button id="new-session" type="button" class="quiet icon-button" aria-label="新建会话" title="新建会话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </header>
    <div id="voice-banner" class="voice-banner" hidden></div>
    <main id="main" tabindex="-1"><p class="loading">正在验证登录状态…</p></main>
    <nav class="tab-bar" aria-label="主要导航">
      <button type="button" data-tab="sessions" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4.5h14A1.5 1.5 0 0 1 20.5 6v10a1.5 1.5 0 0 1-1.5 1.5h-8L5.5 21v-3.5H5A1.5 1.5 0 0 1 3.5 16V6A1.5 1.5 0 0 1 5 4.5Z"/><path d="M8 9h8m-8 4h5"/></svg>
        <span>会话</span>
      </button>
      <button type="button" data-tab="dramas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M3.5 9.5h17M8 5.5l-2 4m7-4-2 4m7-4-2 4M10.5 12.5v4l3.5-2z"/></svg>
        <span>短剧</span>
      </button>
      <button type="button" data-tab="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="m8.2 12 2.5 2.5 5.1-5.2"/></svg>
        <span>任务</span>
      </button>
      <button type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4v7m0 4v5m7-16v3m0 4v9m7-16v9m0 4v3"/><rect x="3" y="11" width="4" height="4" rx="1"/><rect x="10" y="7" width="4" height="4" rx="1"/><rect x="17" y="13" width="4" height="4" rx="1"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="sheet" class="sheet" aria-label="操作面板"><div class="sheet-content"></div></dialog>
</body>
</html>
